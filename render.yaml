services:
  - type: web
    name: vendormind-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: ./data/vendormind.sqlite
      - key: SNAPSHOT_DIR
        value: ./snapshots
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: minimax/minimax-m3.1-flash
      - key: LLM_API_KEY
        sync: false
